<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
      100% { opacity: 0.2; transform: scale(1); }
    }
    @keyframes floatLight {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes shimmer {
      0% { stop-color: #3b82f6; }
      50% { stop-color: #ec4899; }
      100% { stop-color: #3b82f6; }
    }
    .bg-grid { opacity: 0.07; stroke: #ffffff; stroke-width: 1; }
    .dynamic-circle { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .dynamic-float { animation: floatLight 8s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />

  <!-- Grid Lines -->
  <g class="bg-grid">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200 M0,320 H1200" />
    <path d="M100,0 V360 M200,0 V360 M300,0 V360 M400,0 V360 M500,0 V360 M600,0 V360 M700,0 V360 M800,0 V360 M900,0 V360 M1000,0 V360 M1100,0 V360" />
  </g>

  <!-- Dynamic Background Ambient Graphics (behind text) -->
  <circle cx="150" cy="180" r="140" fill="url(#glow)" class="dynamic-circle" />
  <circle cx="1050" cy="120" r="180" fill="url(#glow)" class="dynamic-circle" style="animation-delay: -3s;" />

  <g class="dynamic-float">
    <rect x="950" y="70" width="160" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.4" />
    <circle cx="1030" cy="140" r="35" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.6" />
    <path d="M1000 200 H1060 M980 220 H1080 M1010 240 H1050" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Top Decorative Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" rx="4" fill="url(#accent)" />

  <!-- Foreground Content (Text & Badges) -->
  <g filter="url(#shadow)">
    <!-- Sub-badge / Category -->
    <rect x="80" y="70" width="340" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="95" y="91" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">⚡ CURATED CORRECTIONS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="80" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.5">Awesome Jail Management</text>

    <!-- Subtitle -->
    <text x="80" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="20">Top SaaS Platforms, Open-Source Offender Systems &amp; Corrections Tech</text>

    <!-- Decorative Accent Line -->
    <rect x="80" y="240" width="480" height="4" rx="2" fill="url(#accent)" />

    <!-- Feature Pills -->
    <g transform="translate(80, 265)">
      <rect x="0" y="0" width="140" height="30" rx="8" fill="#334155" />
      <text x="15" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🏢 SaaS Platforms</text>

      <rect x="152" y="0" width="165" height="30" rx="8" fill="#334155" />
      <text x="167" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🔓 Open-Source Repos</text>

      <rect x="329" y="0" width="150" height="30" rx="8" fill="#334155" />
      <text x="344" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📊 Market Analysis</text>
    </g>
  </g>
</svg>
